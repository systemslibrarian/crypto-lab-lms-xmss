name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The gate has to judge pull requests too, or auto-merge has nothing to wait
  # on. Left deliberately unfiltered, exactly as the retired ci.yml had it: a
  # `branches: [main]` filter here would stop gating PRs that target any other
  # base, which is a shrink in coverage.
  pull_request:
  # Required by the post-merge dispatch in dependabot-auto-merge below.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed by ref, NOT a bare `pages`: now that pull_request is a trigger, a bare
  # group would let a PR run cancel a live main deploy, and a `cancelled` run
  # ships nothing while looking like nothing went wrong.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Crypto correctness gates (RFC 8554 vectors + reuse-forgery)
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    # `!= 'pull_request'`, never `== 'push'`: the two read as equivalent but
    # `== 'push'` also skips workflow_dispatch, which would disable the
    # post-merge dispatch this whole mechanism depends on. Safe to gate here
    # because build and deploy are separate jobs -- gating a fused job off for
    # pull requests would disable the PR gate itself.
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. `needs: build` names the SAME build job the deploy depends
  # on, not a copy of it, so a bump can only merge itself once the exact gate
  # that stands between main and the live site has gone green. This job used to
  # live in ci.yml, whose gate ran neither the Playwright install nor the axe
  # WCAG pass; a bump that satisfied only that lighter gate could merge itself,
  # fail the heavier gate on the merge commit, and leave the site serving the
  # old build with nothing red in between. Majors are excluded from the npm
  # group in dependabot.yml -- the 2026-08-18 batch had to hold back 109 bumps
  # and they were overwhelmingly majors (@noble v2 dropped export subpaths,
  # TypeScript 7, vitest 4), so those still want a human.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # Majors included on purpose. `needs:` above already required the whole
      # gate to pass, and that gate -- unit tests, build, axe WCAG and the e2e
      # claims -- judges a bump far better than its version number does. A major
      # that actually breaks this lab fails the gate and stays open for a human.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          #
          # The dispatched filename is this file, deploy.yml -- now the only workflow
          # this repo has.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
